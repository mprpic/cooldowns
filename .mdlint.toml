ignore = ["MD051", "MD060"]  # MD060: table rows are not kept pipe-aligned
# Content is included from README.md via pymdownx.snippets; nothing to lint here.
exclude = ["docs/index.md"]

[rules.MD013]
line_length = 120
heading_line_length = 120
code_blocks = false
tables = false

[rules.MD033]
allowed_elements = ["details", "summary"]
