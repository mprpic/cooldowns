# --- Sidebar groups for sections that are not tools ---
#
# Every h1/h2 heading in README.md must be listed here or be an ecosystem
# anchor; the build fails otherwise. `ecosystems = true` marks where the
# ecosystem groups go. `label` overrides the heading text in the sidebar.

[[group]]
name = "Overview"
anchors = ["dependency-cooldowns", "does-it-actually-work"]
label = { dependency-cooldowns = "Introduction" }

[[group]]
name = "Tools by ecosystem"
ecosystems = true

[[group]]
name = "Beyond package managers"
anchors = ["dependency-update-bots", "security-scanners-and-pr-checks", "registry-level-proxies", "container-images"]

[[group]]
name = "Reference"
anchors = ["cooldownssh", "quick-reference", "bypassing-cooldowns", "faq", "conclusion", "changelog"]
