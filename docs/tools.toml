# Metadata that complements README.md for the site build (build.py).
#
# README.md stays the source of truth for prose and config snippets. This file
# only classifies things so the site can build the sidebar, the per-tool support
# cards, and the support matrix. Each `anchor` is a heading id in README.md.
# Every [[tool]] must match one row of README's quick reference table, and every
# H2 section must belong to an [[ecosystem]] or a [[group]]; the build checks both.
#
# support values:
#   native       built-in, configurable cooldown
#   partial      built-in but limited (e.g. update delay only, unstable/nightly)
#   third-party  only via an external tool or wrapper
#   none         no cooldown support
#
# Optional fields: since (first version with support), default (cooldown that
# applies out of the box; shown as "None" when absent), note (short qualifier),
# unit (what the cooldown value counts), three_days (a three-day cooldown
# written in that tool's syntax; the build checks it appears in the tool's
# README section), table_name (row name in the README quick reference table
# when it differs from `name`).

[[ecosystem]]
id = "python"
name = "Python"
anchor = "python-ecosystem"

[[ecosystem]]
id = "javascript"
name = "JavaScript"
anchor = "javascript-ecosystem"

[[ecosystem]]
id = "rust"
name = "Rust"
anchor = "rust-ecosystem"

[[ecosystem]]
id = "ruby"
name = "Ruby"
anchor = "ruby-ecosystem"

[[ecosystem]]
id = "elixir"
name = "Elixir"
anchor = "elixir-ecosystem"

[[ecosystem]]
id = "jvm"
name = "Scala / JVM"
anchor = "scala-jvm-ecosystem"

[[ecosystem]]
id = "php"
name = "PHP"
anchor = "php-ecosystem"

[[ecosystem]]
id = "tool-managers"
name = "Tool managers"
anchor = "tool-managers"

[[ecosystem]]
